name: Verify and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duolinext-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: website/backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r website/backend/requirements.txt
          npm ci --prefix website/frontend
      - name: Backend tests
        working-directory: website/backend
        run: python -m pytest
      - name: Frontend build
        run: npm --prefix website/frontend run build
      - name: Backend image build
        run: docker build -f website/backend/Dockerfile website
      - name: Frontend image build
        run: docker build -f website/frontend/Dockerfile website

  deploy:
    needs: verify
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          cp deploy/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Pull and restart on server
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ubuntu@40.233.65.88 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/DuolinEXT
          test -f website/.env
          test -f deploy/htpasswd
          git pull --ff-only origin main
          docker compose config --quiet
          docker compose up --build --force-recreate --wait --wait-timeout 180 --remove-orphans
          docker compose ps
          REMOTE
